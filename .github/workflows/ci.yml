name: FlowStock CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flowstock-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement apps/api/requirements-dev.lock
          python -m pip install --no-deps --editable apps/api
      - name: Format
        run: python -m ruff format --check apps/api
      - name: Lint
        run: python -m ruff check apps/api
      - name: Type check
        run: python -m mypy --config-file apps/api/pyproject.toml apps/api/src
      - name: Test
        run: python -m pytest apps/api
      - name: Dependency audit
        run: python -m pip_audit --requirement apps/api/requirements.lock

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test:coverage
      - name: Dependency audit
        run: pnpm audit
      - name: Build
        run: pnpm build

  containers:
    name: Containers, scan and SBOM
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: flowstock_ci
      POSTGRES_USER: flowstock_ci
      POSTGRES_PASSWORD: ci-only-placeholder
      FLOWSTOCK_DATABASE_URL: postgresql+psycopg://flowstock_ci:ci-only-placeholder@postgres:5432/flowstock_ci
      FLOWSTOCK_SECRET_HASH_KEY: ci-only-secret-hash-key-at-least-32-characters
      FLOWSTOCK_DATA_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      GRAFANA_ADMIN_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose definitions
        run: |
          docker compose -f deployment/docker/compose.yaml config --quiet
          docker compose -f deployment/docker/compose.yaml -f deployment/docker/compose.acceptance.yaml config --quiet
      - name: Build immutable candidates
        run: |
          mkdir -p artifacts
          docker build --file deployment/docker/api.Dockerfile --tag flowstock-api:${{ github.sha }} .
          docker build --file deployment/docker/web.Dockerfile --tag flowstock-web:${{ github.sha }} .
          docker image inspect --format='flowstock-api@{{.Id}}' flowstock-api:${{ github.sha }} > artifacts/image-digests.txt
          docker image inspect --format='flowstock-web@{{.Id}}' flowstock-web:${{ github.sha }} >> artifacts/image-digests.txt
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowstock-api:${{ github.sha }}
          format: sarif
          output: artifacts/api-trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          limit-severities-for-sarif: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: flowstock-web:${{ github.sha }}
          format: sarif
          output: artifacts/web-trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          limit-severities-for-sarif: true
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          image: flowstock-api:${{ github.sha }}
          output-file: artifacts/api-sbom.spdx.json
          format: spdx-json
      - name: Generate web SBOM
        uses: anchore/sbom-action@v0
        with:
          image: flowstock-web:${{ github.sha }}
          output-file: artifacts/web-sbom.spdx.json
          format: spdx-json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-evidence-${{ github.sha }}
          path: artifacts
          retention-days: 30
